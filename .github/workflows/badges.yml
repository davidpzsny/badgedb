name: Check Twitch badges

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - name: Detect new badges and post
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TWITCH_GQL_OAUTH: ${{ secrets.TWITCH_GQL_OAUTH }}
          X_LINK_REPLY: ${{ vars.X_LINK_REPLY }}
          X_LIVE_POSTS: ${{ vars.X_LIVE_POSTS }}
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python bot/check_badges.py
      - name: Build SEO pages (one page per badge, sitemap)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: python bot/build_pages.py
      - name: Commit changes
        run: |
          git config user.name "badgedb-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in index.html badges.json events.json channel-badges.json channels-state.json emotes.json popularity.json posts.json status.json top-categories.json \
                   badges timeline channel emotes popularity stats categories faq privacy terms legal contact assets sitemap.xml robots.txt 404.html; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Update badges $(date -u +%F)"
          for i in 1 2 3; do
            if ! git pull -q --rebase; then
              git rebase --abort
              echo "::warning::Files were uploaded while the bot was running - this run's save is skipped, the next run (15 min) redoes it."
              exit 0
            fi
            if git push -q; then echo "Saved."; exit 0; fi
            sleep 5
          done
          echo "::warning::Could not push after 3 tries - the next run will retry."
