name: Check Twitch badges

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - name: Detect new badges and post
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TWITCH_GQL_OAUTH: ${{ secrets.TWITCH_GQL_OAUTH }}
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python bot/check_badges.py
      - name: Build SEO pages (one page per badge, sitemap)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python bot/build_pages.py
      - name: Commit changes
        run: |
          git config user.name "badgedb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add badges.json events.json channel-badges.json channels-state.json badges timeline assets sitemap.xml robots.txt 404.html
          git diff --cached --quiet || (git commit -m "Update badges $(date -u +%F)" && git pull --rebase && git push)
