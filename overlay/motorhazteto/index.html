html,body{margin:0;padding:0;background:#000;overflow:hidden}
*{box-sizing:border-box}
@keyframes scrollY{from{transform:translateY(0)}to{transform:translateY(var(--to,-50%))}}
.b{font-family:'Barlow',sans-serif} .bc{font-family:'Barlow Condensed',sans-serif} .bsc{font-family:'Barlow Semi Condensed',sans-serif}
.slot{display:block;flex:none;object-fit:contain}

.stage{width:1920px;height:1080px;background:#000;color:#efeff1;font-family:'Barlow',sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* top bar */
.top{height:104px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 30px;border-bottom:1px solid #1c1c20}
.clock{display:flex;flex-direction:column;justify-content:center;line-height:1}
.clock .date{font-weight:700;font-size:23px;letter-spacing:1.5px;color:#7d7d86}
.clock .time{font-weight:700;font-size:40px;letter-spacing:1px;color:#efeff1;font-variant-numeric:tabular-nums;margin-top:4px}
.clock .time span{font-size:24px;color:#9146ff;font-weight:600}
.brand{display:flex;align-items:center;gap:14px}
.brand .logo{width:72px;height:72px;border-radius:16px;object-fit:cover;display:block;flex:none}
.brand .name{font-weight:800;font-size:46px;letter-spacing:-1px;line-height:1;display:flex}
.brand .twitch{width:42px;height:42px;display:block;flex:none}
.avail{display:flex;align-items:center;justify-content:flex-end;gap:18px;min-width:0}
.avail .head{text-align:right;line-height:1;flex:none;max-width:300px}
.avail .k{font-weight:700;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;color:#7d7d86}
.avail .t{font-weight:800;font-size:24px;letter-spacing:.5px;text-transform:uppercase;color:#efeff1;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avail .sep{width:1px;height:46px;background:#26262b;flex:none}
.avail .list{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
.chip{display:flex;align-items:center;gap:11px;padding:7px 14px 7px 7px;background:#121214;border:1px solid #232328;border-radius:12px;flex:none}
/* more chips than fit: they take turns, one at a time */
.avail .list.rot .chip{display:none}
.avail .list.rot{justify-content:flex-end}
.avail .list.rot .chip.on{display:flex;animation:chipIn .45s ease-out}
@keyframes chipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chip .imgs{display:flex;align-items:center;gap:4px}
.chip .imgs img{width:44px;height:44px;border-radius:9px}
.chip .l{font-weight:700;font-size:17px;color:#efeff1;white-space:nowrap}
.chip .a{font-weight:700;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap;margin-top:5px}

/* body */
.body{flex:1;display:flex;gap:24px;padding:24px 30px;min-height:0}
.colL{width:470px;flex:none;display:flex;flex-direction:column;min-height:0}
.colR{flex:1;display:flex;flex-direction:column;min-height:0}
.h{font-weight:800;font-size:30px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.win{flex:1;min-height:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.roll{display:flex;flex-direction:column;will-change:transform}
.evcols{flex:1;min-height:0;display:flex;gap:16px}

.item{background:#121214;border:1px solid #1f1f23;border-radius:8px;overflow:hidden;margin-bottom:10px;flex:none}
.item .bar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#0c0c0e;border-bottom:1px solid #1f1f23}
.item .added{font-weight:700;font-size:14px;letter-spacing:.8px;color:#a970ff;white-space:nowrap}
.item .right{display:flex;align-items:center;gap:8px;flex:none}
.pill{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;border-radius:5px;padding:2px 7px;line-height:1;white-space:nowrap}
.item .users{font-weight:600;font-size:14px;letter-spacing:.8px;color:#6b6b73;white-space:nowrap}
.item .main{display:flex;align-items:center;gap:14px;padding:12px 14px}
.item .main img{width:42px;height:42px;border-radius:8px}
.item .title{font-weight:700;font-size:20px;letter-spacing:.3px}
.item .title .nw{white-space:nowrap}                 /* the last word and NEW never get separated */
.item .title .pill{display:inline-block;margin-left:8px;vertical-align:3px}
.item .sub{font-weight:600;font-size:15px;letter-spacing:1px;color:#6b6b73;text-transform:uppercase;margin-top:2px}

.ev{background:#121214;border:1px solid #1f1f23;border-radius:8px;overflow:hidden;margin-bottom:16px;flex:none}
.ev .bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.ev .st{font-weight:800;font-size:17px;letter-spacing:1.5px}
.ev .cd{font-weight:700;font-size:15px;letter-spacing:1px;opacity:.92;font-variant-numeric:tabular-nums}
.ev .in{padding:14px 16px 16px}
.ev .row{display:flex;align-items:center;gap:12px}
.ev .imgs{display:flex;gap:6px;flex:none}
.ev .imgs img{width:34px;height:34px;border-radius:7px}
.ev .title{font-weight:800;font-size:22px;letter-spacing:.5px;text-transform:uppercase;line-height:1.02}
.ev .desc{font-weight:400;font-size:15px;line-height:1.35;color:#b6b6bf;margin-top:11px}
.ev .dates{display:flex;gap:28px;margin-top:14px;padding-top:12px;border-top:1px solid #1f1f23}
.ev .dk{font-weight:700;font-size:13px;letter-spacing:1.2px;color:#6b6b73}
.ev .dv{font-weight:700;font-size:15px;color:#dedee3;font-variant-numeric:tabular-nums;margin-top:2px}

/* footer */
.foot{height:64px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 30px;border-top:2px solid #9146ff;background:#09090b}
.foot .x{display:flex;align-items:center;gap:12px}
.foot .xi{width:32px;height:32px;border-radius:7px;background:#000;border:1px solid #2a2a2e;display:flex;align-items:center;justify-content:center;flex:none}
.foot .big{font-weight:700;font-size:26px;letter-spacing:1px;color:#efeff1}
.foot .counts{display:flex;align-items:center;gap:48px}
.foot .c{display:flex;align-items:center;gap:13px}
.foot .dot{width:11px;height:11px;border-radius:50%;flex:none}
.foot .ck{font-weight:700;font-size:23px;letter-spacing:1.5px;color:#7d7d86;text-transform:uppercase}
.foot .cv{font-weight:800;font-size:30px;color:#efeff1;font-variant-numeric:tabular-nums;line-height:1}
.foot .vsep{width:1px;height:30px;background:#26262b}
.foot .site{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.foot .site img{width:32px;height:32px;border-radius:7px;object-fit:cover;display:block;flex:none}
</style>
</head>

function countdown(ms, prefix){
  if(ms <= 0) return 'JUST NOW';
  const days = Math.floor(ms / 864e5), hrs = Math.floor((ms % 864e5) / 36e5), mins = Math.floor((ms % 36e5) / 6e4);
  if(days > 0) return `${prefix} ${days}D ${hrs}H`;
  if(hrs > 0) return `${prefix} ${hrs}H ${mins}M`;
  return `${prefix} ${mins}M`;
}

/* ---------- live data from badgedatabase.com (events, left column, footer counters) ---------- */
let site = { events: null, badges: null, pop: null };
async function getJson(file){
  for(const base of ['https://raw.githubusercontent.com/davidpzsny/badgedb/main/', 'https://badgedatabase.com/']){
    try{ const r = await fetch(base + file + '?t=' + Date.now(), {cache: 'no-store'}); if(r.ok) return await r.json(); }catch(e){}
  }
  return null;
}
const cacheGet = k => { try{ return JSON.parse(localStorage.getItem('ov_' + k) || 'null'); }catch(e){ return null; } };
const cacheSet = (k, v) => { try{ localStorage.setItem('ov_' + k, JSON.stringify(v)); }catch(e){} };
async function loadStats(){
  let [evs, badges, pop] = await Promise.all([getJson('events.json'), getJson('badges.json'), getJson('popularity.json')]);
  if(Array.isArray(evs)) cacheSet('events', evs); else evs = site.events || cacheGet('events');      // offline: last good copy
  if(Array.isArray(badges)) cacheSet('badges', badges); else badges = site.badgesRaw || cacheGet('badges');
  if(pop && pop.counts) cacheSet('pop', pop); else pop = cacheGet('pop');
  if(Array.isArray(evs)) site.events = evs;
  if(Array.isArray(badges)){ site.badgesRaw = badges; site.badges = groupBadges(badges); }
  if(pop && pop.counts){ site.pop = pop.counts; site.sdb = pop.sdb || {}; }
  render();
  if(!site.events) setTimeout(loadStats, 30000);                                                   // nothing yet: try again soon
}

/* the Events column from the site's events.json, in the shape the cards use */
const PLACEHOLDER_HOW = /^(objective|details) not (announced|confirmed)/i;
const andJoin = a => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const orJoin  = a => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' or ' + a[a.length - 1];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const noLongDash = t => String(t || '').replace(/\s*\u2014\s*/g, ', ');
function shortHow(how){                        // the usual category objectives in a short form; null = say it as written
  const h = how.trim().replace(/\.$/, '');
  if(/^subscribe \(tier 1\) or gift a tier 1 sub in the category$/i.test(h)) return { kind: 'sub', text: 'sub or gift a Tier 1 sub' };
  const m = h.match(/^watch (\d+) minutes in the category$/i);
  if(m){ const n = +m[1]; return { kind: 'watch', text: n % 60 ? `watch ${n} minutes` : `watch ${n / 60} hour${n === 60 ? '' : 's'}` }; }
  if(/^watch a stream in the category$/i.test(h)) return { kind: 'any', text: 'watch' };
  return null;
}
function eventDesc(ev){
  const cat = String(ev.category || ''), generic = !cat || GENERIC_CAT.some(w => cat.toLowerCase().includes(w));
  const names = ev.badges.map(b => b.name), hows = ev.badges.map(b => String(b.how || '').trim());
  const tba = h => !h || PLACEHOLDER_HOW.test(h), inCat = generic ? '' : ' in ' + cat;
  const where = (ev.channels || []).length ? 'a participating channel' : 'any channel';
  if(hows.every(tba))
    return `The ${andJoin(names)} badge${names.length > 1 ? 's' : ''} will be available${inCat}. Objective${names.length > 1 ? 's' : ''} to be announced.`;
  const sh = hows.map(h => tba(h) ? null : shortHow(h));
  if(!generic && sh.every(Boolean)){
    const kinds = [...new Set(sh.map(x => x.text))];
    if(kinds.length === 1){                    // one objective for every badge
      const x = sh[0], verb = x.kind === 'any' ? `Watch ${where} live in ${cat}` : x.kind === 'sub' ? `Sub or gift a Tier 1 sub to ${where} live in ${cat}` : `${cap(x.text)} of ${where} live in ${cat}`;
      return `${verb} to earn the ${andJoin(names)} badge${names.length > 1 ? 's' : ''}.`;
    }
    return cap(orJoin(kinds.map(k => `${k} (${andJoin(names.filter((n, i) => sh[i].text === k))})`))) + ` in ${cat}.`;
  }
  const groups = new Map();                    // otherwise "Badge: objective." (badges with the same objective together)
  hows.forEach((h, i) => { let t = tba(h) ? 'Objective to be announced' : h.replace(/\s+in the category(?=\.?$)/i, inCat);
    if(names.length > 1) t = t.replace(/^unlock [^,]+, then /i, 'Unlock the previous badge, then ');      // evolution chains read as one line
    if(!groups.has(t)) groups.set(t, []); groups.get(t).push(names[i]); });
  const end = t => /[.!?)]$/.test(t) ? t : t + '.';
  if(groups.size === 1 && names.length === 1) return end([...groups.keys()][0]);
  return [...groups].map(([t, ns]) => `${andJoin(ns)}: ${end(t)}`).join(' ');
}
function siteEventCards(now){
  const evs = site.events; if(!evs) return [];
  const badges = site.badges || [], STALE = 21 * 864e5;
  const added = ev => (ev.badges || []).map(b => (badges.find(g => g.imgs.includes(b.img)) || {}).added).filter(Boolean).sort()[0];
  return evs.filter(ev => {
    if(!(ev.badges || []).length) return false;
    if(ev.end && Date.parse(ev.end) <= now) return false;                                    // over
    if(!ev.start){ const a = added(ev); if(a && now - Date.parse(a) > STALE) return false; }   // no dates for 21+ days: the site counts it as ended
    return true;
  }).map(ev => ({ slot: ev.id, imgs: ev.badges.map(b => b.img).filter(Boolean), title: noLongDash(EVENT_TITLES[ev.id] || ev.name),
                  desc: noLongDash(EVENT_DESC[ev.id] || eventDesc(ev)), start: ev.start || null, end: ev.end || null, tba: !!ev.time_tba }));
}
function overlayEvents(now){
  const list = siteEventCards(now).concat(EXTRA_EVENTS), t = x => x ? Date.parse(x) : null;
  const rank = e => { const s = t(e.start); return s === null ? 2 : now < s ? 1 : 0; };   // running, upcoming, date TBA
  return list.sort((a, b) => rank(a) - rank(b) || (rank(a) === 0 ? (t(a.end) || 9e15) - (t(b.end) || 9e15) : rank(a) === 1 ? t(a.start) - t(b.start) : 0));
}
// badges.json rows: [title, img, added, free, users, set, desc]
function groupBadges(rows){
  const groups = new Map();
  rows.forEach(r => { const k = r[5] || r[1]; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  return [...groups.entries()].map(([set, rs]) => { const p = rs[rs.length - 1];
    return { set, name: p[0], img: p[1], added: p[2] || '', free: rs.some(x => x[3] === 1), users: Math.max(...rs.map(x => x[4] || 0)), imgs: rs.map(x => x[1]) }; });
}
function evByImg(){ const map = {}; (site.events || []).forEach(ev => (ev.badges || []).forEach(b => { if(b.img) map[b.img] = { ev, b }; })); return map; }
function siteCounts(now){                     // same rules as the site: badge counts, TBA older than 21 days = ended
  const evs = site.events; if(!evs) return null;
  const STALE = 21 * 864e5, badges = site.badges || [], byImg = evByImg();
  const st = e => !e.start ? 'tba' : now < Date.parse(e.start) ? 'soon' : now > Date.parse(e.end) ? 'ended' : 'live';
  const added = ev => (ev.badges || []).map(b => (badges.find(g => g.imgs.includes(b.img)) || {}).added).filter(Boolean).sort()[0];
  const stale = ev => { if(ev.start) return false; const a = added(ev); return !!a && now - Date.parse(a) > STALE; };
  const orphans = badges.filter(b => !b.imgs.some(i => byImg[i]) && b.added && now - Date.parse(b.added) < STALE);
  const live = evs.filter(e => st(e) === 'live'), n = list => list.reduce((s, e) => s + (e.badges || []).length, 0);
  return { active: n(live), upcoming: n(evs.filter(e => st(e) === 'soon')), tba: n(evs.filter(e => st(e) === 'tba' && !stale(e))) + orphans.length,
           free: live.reduce((s, e) => s + (e.badges || []).filter(b => b.cost === 'free').length, 0) };
}
function siteItems(now){                      // every badge set added in the last 14 days, newest first
  const badges = site.badges; if(!badges) return null;
  const pop = site.pop || {}, sdb = site.sdb || {}, byImg = evByImg(), cutoff = now - 14 * 864e5;
  const list = badges.filter(b => b.added && Date.parse(b.added) >= cutoff).sort((a, b) => b.added.localeCompare(a.added));
  if(!list.length) return null;
  return list.map(b => { const e = b.imgs.map(i => byImg[i]).find(Boolean);
    const cost = e && e.b.cost && e.b.cost !== 'na' ? e.b.cost : b.free ? 'free' : '';
    const d = new Date(b.added + 'T00:00:00Z'), users = sdb[b.set] || pop[b.set] || b.users || 0;   // admin button counts, else PotatBotat; 0 = N/A
    return { slot: 'auto-' + b.set, added: `${M[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`, users: users ? users.toLocaleString('en-US') : 'N/A', cost, title: b.name, sub: 'Global Badge', img: b.img }; });
}

/* ---------- current stream category: DecAPI (about a minute fresh), else the site bot's live.json (15 min) ---------- */
let streamCat = null, live = null;            // streamCat null = unknown: only the EXTRA_AVAILABLE chips show
/* 1) Twitch itself (the category set in the stream manager, the moment it changes, with its id),
   2) DecAPI, 3) the bot's live.json (every 5 minutes) */
let gqlFails = 0, streamCatId = null;
async function gqlCategory(){
  if(gqlFails >= 3) return null;                     // not reachable from here: stop asking
  try{
    const r = await fetch('https://gql.twitch.tv/gql', { method: 'POST', cache: 'no-store',
      headers: { 'Client-Id': 'kimne78kx3ncx6brgo4mv6wki5h1ko', 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ query: `query { user(login: "${CHANNEL}") { broadcastSettings { game { id name displayName } } } }` }) });
    if(!r.ok) throw new Error(r.status);
    const g = (((await r.json()).data || {}).user || {}).broadcastSettings;
    gqlFails = 0;
    return g && g.game ? { id: String(g.game.id), name: g.game.name || g.game.displayName } : { id: null, name: '' };
  }catch(e){ gqlFails++; return null; }
}
async function loadCategory(){
  const [gq, dec, j] = await Promise.all([
    gqlCategory(),
    fetch('https://decapi.me/twitch/game/' + CHANNEL + '?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.text() : '').catch(() => ''),
    getJson('live.json')]);
  if(j && typeof j === 'object') live = j;
  const t = String(dec || '').trim();
  if(gq && gq.name){ streamCat = gq.name; streamCatId = gq.id; }
  else if(t && t.length < 80 && !/not found|error|invalid|rate limit|<html/i.test(t)){ streamCat = t; streamCatId = null; }
  else if(live && live.our_live && live.our_game){ streamCat = live.our_game; streamCatId = live.our_game_id || null; }
  render();
}

/* badges of the current category: matched by Twitch category id (the bot writes the ids and Twitch's own names into
   live.json), else by the exact category name */
const GENERIC_CAT = ['any', 'various', 'multiple', 'eligible', 'categories', 'unknown', 'twitchcon'];
const normCat = t => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
function inStreamCategory(ev){
  const cat = String(ev.category || '');
  if(!streamCat || !cat || GENERIC_CAT.some(w => cat.toLowerCase().includes(w))) return false;   // a list like "A, B" never equals one category
  const chans = (ev.channels || []).map(c => String(c).trim().toLowerCase()).filter(Boolean);
  if(chans.length && !chans.includes(CHANNEL)) return false;              // only on certain channels, not ours
  const gid = live && ((live.events && live.events[ev.id] && live.events[ev.id].game_id) || (live.upcoming && live.upcoming[ev.id]));
  if(gid){
    if(streamCatId) return gid === streamCatId;                          // Twitch's own category id: exact
    const name = live.game_names && live.game_names[gid];
    if(name) return normCat(name) === normCat(streamCat);
    if(live.our_game_id && normCat(live.our_game) === normCat(streamCat)) return gid === live.our_game_id;
  }
  return normCat(cat) === normCat(streamCat);
}
const OTHER_CHANNEL = /twitch\.tv\/|(^|\s)\/[a-z0-9_]{3,}/i, OUR_CHANNEL_RE = new RegExp('(twitch\\.tv)?/' + CHANNEL + '\\b', 'i');
function badgeAction(b){
  const how = String(b.how || '');
  const daily = how.match(/watch[^0-9]*(\d+)\s*(?:minutes?|mins?)\s*a day for (\d+) days/i);
  if(daily) return { text: `Watch ${daily[1]} min × ${daily[2]} days`, color: '#4ade80' };
  if(OTHER_CHANNEL.test(how) && !OUR_CHANNEL_RE.test(how)) return null;      // must be earned on another channel
  if(/\b(eligible|participating) [^.]*channels?\b/i.test(how)) return null;   // only on a list of channels (badge_db is not one)
  if(b.cost === 'paid') return /ticket/i.test(how) ? null : { text: 'Sub or Gift', color: '#c4a1ff' };
  const m = how.match(/watch[^0-9]*(\d+)\s*(minutes?|mins?|hours?|h)\b/i);
  if(m){ const n = +m[1], hrs = /^h/i.test(m[2]) ? n : n >= 60 && n % 60 === 0 ? n / 60 : 0;    // 240 minutes reads "Watch 4 hours"
    return { text: hrs ? `Watch ${hrs} ${hrs === 1 ? 'hour' : 'hours'}` : `Watch ${n} min`, color: '#4ade80' }; }
  if(b.cost === 'free' || /watch/i.test(how)) return { text: 'Watch', color: '#4ade80' };
  return { text: 'Objective TBA', color: '#9a9aa3' };
}
// badges of any category: category "Any" (not "Any · channel: …") and no channel list without badge_db
function anyCategory(ev){
  const cat = String(ev.category || '').trim(), chans = (ev.channels || []).map(c => String(c).trim().toLowerCase()).filter(Boolean);
  return /^any\b/i.test(cat) && !/channel/i.test(cat) && !(chans.length && !chans.includes(CHANNEL));
}
// events that list their eligible categories (e.g. Pokémon Night Out: Just Chatting, Art, Pokémon GO, ...)
const inCategoryList = ev => Array.isArray(ev.categories) && !!streamCat && ev.categories.some(c => normCat(c) === normCat(streamCat))
  && !((ev.channels || []).length && !(ev.channels || []).map(c => String(c).trim().toLowerCase()).includes(CHANNEL));
const SOON_MS = 24 * 3600e3;                 // upcoming badges get a "STARTS IN" chip from this long before their start
function autoAvailable(now){
  if(!streamCat || !site.events) return [];
  const chips = [], withAny = ANY_CATEGORY_BADGES_IN.some(c => normCat(c) === normCat(streamCat));
  site.events.forEach(ev => {
    if(!ev.start || !ev.end) return;
    const start = Date.parse(ev.start), end = Date.parse(ev.end), any = (withAny && anyCategory(ev)) || inCategoryList(ev);
    if(!(now < end) || !(any || inStreamCategory(ev))) return;
    if(any && now < start) return;                     // any-category badges: only once they can be earned
    if(now < start && (ev.time_tba || start - now > SOON_MS)) return;   // later ones (e.g. LoL fan badges days away) stay out of the header
    const groups = new Map();                  // badges of one event with the same objective share a chip (e.g. 5 LoL badges)
    (ev.badges || []).forEach(b => {
      const act = badgeAction(b); if(!act) return;
      if(any && act.text === 'Objective TBA') return;          // not earnable yet
      const key = now < start ? 'soon' : any ? 'all' : act.text;   // any-category events (Pokémon Night Out): one chip for the event
      if(!groups.has(key)) groups.set(key, { act, badges: [] });
      groups.get(key).badges.push(b);
    });
    if(groups.has('all')){                     // one action line for the whole event, even if the badges' objectives differ a bit
      const g = groups.get('all'), acts = [...new Set(g.badges.map(b => badgeAction(b).text))];
      if(acts.length > 1){
        const mins = [...new Set(g.badges.map(b => ((String(b.how).match(/watch[^0-9]*(\d+)\s*min/i) || [])[1])).filter(Boolean))];
        const daily = g.badges.some(b => /a day for \d+ days/i.test(b.how || ''));
        g.act = acts.every(t => /^watch/i.test(t)) && mins.length === 1 ? { text: `Watch ${mins[0]} min${daily ? ' a day' : ''}`, color: '#4ade80' }
              : acts.every(t => /^watch/i.test(t)) ? { text: 'Watch', color: '#4ade80' } : { text: 'Sub, gift or watch', color: '#4ade80' };
      }
    }
    groups.forEach(({act, badges}) => {
      const label = badges.length === 1 ? badges[0].name : (EVENT_TITLES[ev.id] || ev.name), imgs = badges.slice(0, any ? 3 : 5).map(b => b.img);
      chips.push(now < start ? { imgs, label, cdTo: start, soon: true } : { imgs, label, action: act.text, actionColor: act.color });
    });
  });
  return chips;
}

/* ---------- rendering: lists are rebuilt only when their content changes (so the scrolling never jumps);
   clock and countdowns are updated in place every second ---------- */
const lastSig = {};
function setList(id, html){ if(lastSig[id] !== html){ lastSig[id] = html; $(id).innerHTML = html; return true; } return false; }
/* scrolling columns: every column moves at the same speed; a list that fits in its column stands still (no doubles).
   When the content changes (a new badge, user counts, an event starting) the list keeps its place instead of jumping. */
const ROLL_PX_PER_S = 30;
const ROLL_START = { eventsB: 0.5 };                 // the second events column starts half a turn ahead
const roll = {};                                     // id -> { html, h }
function rollOffset(id, el){                         // how far (px) the column has scrolled within one copy
  try{ const a = el.getAnimations()[0], p = a && a.effect.getComputedTiming().progress;
       if(typeof p === 'number' && roll[id] && roll[id].h) return p * roll[id].h; }catch(e){}
  return null;
}
function setRoll(id, html, force){
  const el = $(id), old = roll[id];
  if(!force && old && old.html === html){            // same cards: only measure again if their size changed (fonts, images)
    const full = el.scrollHeight;
    if(old.h ? full === old.h * old.n : full <= el.parentElement.clientHeight) return;
  }
  const off = rollOffset(id, el);
  el.style.animation = 'none'; el.innerHTML = html;
  const h = el.scrollHeight, win = el.parentElement.clientHeight;
  roll[id] = { html, h: 0, n: 1 };
  if(!h || h <= win) return;                         // everything fits: stand still
  const n = Math.ceil(win / h) + 1;
  el.innerHTML = html.repeat(n);                     // enough copies to fill the column all the way round
  roll[id].h = h; roll[id].n = n;
  const dur = h / ROLL_PX_PER_S, p = off !== null ? (off % h) / h : (ROLL_START[id] || 0);
  el.style.setProperty('--to', -h + 'px');
  void el.offsetWidth;                               // restart the animation from the kept position
  el.style.animation = `scrollY ${dur.toFixed(2)}s linear ${(-p * dur).toFixed(2)}s infinite`;
}
function refreshRolls(){ Object.keys(roll).forEach(id => setRoll(id, roll[id].html, true)); }   // re-measure (fonts, size)
const img = (u, cls) => u ? `<img class="slot${cls ? ' ' + cls : ''}" src="${esc(badgeUrl(u))}" alt="">` : '';

function eventView(e, now){
  const start = e.start ? Date.parse(e.start) : null, end = e.end ? Date.parse(e.end) : null;
  if(start === null) return { e, status: 'UPCOMING', bg: '#d99e1e', fg: '#1a1205', cdTo: null, cdText: 'DATE TBA', startLabel: 'STARTS' };
  if(now < start && e.tba){ const d = new Date(start); return { e, status: 'UPCOMING', bg: '#d99e1e', fg: '#1a1205', cdTo: null, cdText: `STARTS ${MS[d.getUTCMonth()]} ${d.getUTCDate()}`, startLabel: 'STARTS' }; }   // only the day is known
  if(now < start)    return { e, status: 'UPCOMING', bg: '#d99e1e', fg: '#1a1205', cdTo: start, prefix: 'STARTS IN', startLabel: 'STARTS' };
  if(end === null || now < end) return { e, status: 'ACTIVE', bg: '#3ba55d', fg: '#06160c', cdTo: end, prefix: 'ENDS IN', cdText: end === null ? 'LIVE' : '', startLabel: 'STARTED' };
  return { e, status: 'ENDED' };
}
function eventCard(v){
  const e = v.e, cd = v.cdTo ? `<span class="cd bsc" style="color:${v.fg}" data-to="${v.cdTo}" data-prefix="${v.prefix}"></span>` : `<span class="cd bsc" style="color:${v.fg}">${v.cdText}</span>`;
  return `<div class="ev"><div class="bar" style="background:${v.bg}"><span class="st bc" style="color:${v.fg}">${v.status}</span>${cd}</div>
    <div class="in"><div class="row">${e.imgs.length ? `<div class="imgs">${e.imgs.map(u => img(u)).join('')}</div>` : ''}<div class="title bc">${esc(e.title)}</div></div>
      <div class="desc b">${esc(e.desc)}</div>
      <div class="dates"><div><div class="dk bc">${v.startLabel}</div><div class="dv b">${e.start ? (e.tba ? dayStamp(Date.parse(e.start)) : stamp(Date.parse(e.start))) : 'To be announced'}</div></div>
        <div><div class="dk bc">ENDS</div><div class="dv b">${e.end ? (e.tba ? dayStamp(Date.parse(e.end)) : stamp(Date.parse(e.end))) : 'To be announced'}</div></div></div></div></div>`;
}
// the NEW label always sits right after the name, also when a long name wraps to a second line
function titleNew(title, isNew){
  const t = String(title || '').trim(); if(!isNew) return esc(t);
  const i = t.lastIndexOf(' '), pill = '<span class="pill" style="color:#fff;background:#9146ff">New</span>';
  return `${i > 0 ? esc(t.slice(0, i + 1)) : ''}<span class="nw">${esc(t.slice(i + 1))}${pill}</span>`;
}
function itemCard(it, now){
  const isNew = Date.parse(it.added) >= now - 14 * 864e5;
  const cost = it.cost ? `<span class="pill" style="color:${it.cost === 'free' ? '#4ade80' : '#c4a1ff'};background:${it.cost === 'free' ? '#123920' : '#2d1a4d'}">${esc(it.cost.toUpperCase())}</span>` : '';
  return `<div class="item"><div class="bar"><span class="added bsc">ADDED: ${esc(it.added)}</span><span class="right">${cost}<span class="users bsc">USERS: ${esc(it.users)}</span></span></div>
    <div class="main">${img(it.img)}<div style="line-height:1.1;min-width:0"><div class="title b">${titleNew(it.title, isNew)}</div>
      <div class="sub bc">${esc(it.sub)}</div></div></div></div>`;
}

function render(){
  const now = Date.now(), d = new Date(now);
  $('date').textContent = `${M[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
  $('time').textContent = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;

  const evList = overlayEvents(now);
  const views = evList.map(e => eventView(e, now)), bySlot = {};
  views.forEach(v => { bySlot[v.e.slot] = v; });
  const visible = views.filter(v => v.status !== 'ENDED'), half = Math.ceil(visible.length / 2);
  setRoll('eventsA', visible.slice(0, half).map(eventCard).join(''));
  setRoll('eventsB', visible.slice(half).map(eventCard).join(''));

  const items = siteItems(now) || ITEMS;
  setRoll('items', items.map(it => itemCard(it, now)).join(''));

  const isActive = k => !!(bySlot[k] && bySlot[k].status === 'ACTIVE'), isSoon = k => !!(bySlot[k] && bySlot[k].status === 'UPCOMING');
  const evStart = k => { const e = evList.find(x => x.slot === k); return e && e.start ? Date.parse(e.start) : null; };
  const hideAll = streamCat && HIDE_AVAILABLE_IN.some(c => c.toLowerCase() === streamCat.toLowerCase());
  const extra = EXTRA_AVAILABLE.filter(a => (!a.ev || isActive(a.ev) || (a.showSoon && isSoon(a.ev))) && !(a.hideWhen && (isActive(a.hideWhen) || isSoon(a.hideWhen))))
    .map(a => { const soon = a.ev && isSoon(a.ev) && evStart(a.ev);
      return soon ? { ...a, cdTo: evStart(a.ev), soon: true } : { ...a, actionColor: /watch/i.test(a.action) ? '#4ade80' : '#c4a1ff' }; });
  const auto = hideAll ? [] : autoAvailable(now), avail = hideAll ? [] : auto.concat(extra);
  document.querySelector('.avail').style.visibility = avail.length ? '' : 'hidden';   // nothing to show: no label, no line
  const chipsChanged = setList('available', avail.map(a => {
    const action = a.soon ? `<div class="a bc" style="color:#f5b83d" data-to="${a.cdTo}" data-prefix="STARTS IN"></div>`
                          : `<div class="a bc" style="color:${a.actionColor}">${esc(a.action)}</div>`;
    return `<div class="chip"><div class="imgs">${a.imgs.map(u => img(u)).join('')}</div><div style="line-height:1;min-width:0"><div class="l b">${esc(a.label)}</div>${action}</div></div>`; }).join(''));
  if(chipsChanged) fitChips();
  $('availHead').textContent = avail.length && avail.every(a => a.soon) ? 'Coming Here' : 'Available Here';
  $('availTitle').textContent = auto.length ? streamCat : [...new Set(extra.map(a => a.game).filter(Boolean))].join(' · ');

  const sc = siteCounts(now) || FALLBACK_COUNTS;
  $('cActive').textContent = sc.active; $('cUpcoming').textContent = sc.upcoming; $('cTba').textContent = sc.tba; $('cFree').textContent = sc.free;

  document.querySelectorAll('[data-to]').forEach(el => {          // only touch the ones that changed (less repainting)
    const t = countdown(+el.dataset.to - now, el.dataset.prefix); if(el.textContent !== t) el.textContent = t; });
}

/* header chips: when they don't all fit next to each other, show them one at a time, switching every 6 seconds */
let chipIdx = 0;
function fitChips(){
  const list = $('available'); list.classList.remove('rot'); list.style.width = ''; chipIdx = 0;
  if(list.children.length > 1 && list.scrollWidth > list.clientWidth + 2){
    const widest = Math.max(...[...list.children].map(c => c.offsetWidth));      // same width for every turn, so nothing jumps
    list.classList.add('rot'); list.children[0].classList.add('on'); list.style.width = widest + 'px';
  }
}
setInterval(() => {
  const list = $('available'); if(!list.classList.contains('rot') || !list.children.length) return;
  list.children[chipIdx % list.children.length].classList.remove('on');
  chipIdx = (chipIdx + 1) % list.children.length; list.children[chipIdx].classList.add('on');
}, 6000);
addEventListener('resize', () => { if($('available').children.length) fitChips(); refreshRolls(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if($('available').children.length) fitChips(); refreshRolls(); });   // measured in the final font

/* ---------- reload by itself when a new version is uploaded (version.json) ---------- */
async function checkVersion(){
  try{
    const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'}); if(!r.ok) return;
    const v = String((await r.json()).v || '');
    if(v && v !== OVERLAY_V && new URLSearchParams(location.search).get('v') !== v)
      location.replace(location.pathname + '?v=' + encodeURIComponent(v));   // new query = fresh copy, past every cache
  }catch(e){}
}

(function fromCache(){ const e = cacheGet('events'), b = cacheGet('badges'), p = cacheGet('pop');
  if(Array.isArray(e)) site.events = e; if(Array.isArray(b)){ site.badgesRaw = b; site.badges = groupBadges(b); } if(p && p.counts){ site.pop = p.counts; site.sdb = p.sdb || {}; } })();
render();
setInterval(render, 1000);
loadStats(); setInterval(loadStats, 300000);
loadCategory(); setInterval(loadCategory, 30000);   // the header follows a category change within about half a minute
setInterval(checkVersion, 30000); setTimeout(checkVersion, 5000);
</script>
